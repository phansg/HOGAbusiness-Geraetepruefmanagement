<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geräteprüfmanagement · HOGAbusiness</title><link rel="stylesheet" href="./css/style.css"></head>
<body>
<header><div class="shell top"><img src="./assets/logo.png" alt="HOGAbusiness"><span>Geräteprüfmanagement</span><button id="logout" hidden>Abmelden</button></div></header>
<main class="shell">
<p class="notice">Testversion · Nur fiktive Daten · Keine fachliche Freigabe</p>
<p id="sync" role="status" aria-live="polite"></p>
<section id="login" class="card login">
<h1>Anmelden</h1>
<form id="login-form" method="post"><label>Anmeldebereich<select name="area"><option value="staff">Administration und Prüfung</option><option value="customer">Kundenportal</option></select></label>
<label>E-Mail<input name="email" type="email" autocomplete="username" required></label>
<label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
<button class="primary" disabled>Anmelden</button></form>
</section>
<section id="workspace" hidden>
<div class="top context"><h1 id="greeting"></h1><label>Mandant<select id="tenant"></select></label></div>
<nav id="navigation" aria-label="Anwendungsbereiche"></nav>
<section id="view"></section>
</section>
<noscript><p>Bitte JavaScript aktivieren, um die Anwendung zu öffnen.</p></noscript>
</main>
<dialog id="dialog"></dialog>
<footer class="shell">HOGAbusiness · Geräteprüfmanagement V0.1</footer>
<script defer src="./assets/vendor/jspdf.umd.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body></html>
